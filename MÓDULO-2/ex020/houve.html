<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        div {
            font-size: 24px;
            color: black;
            background-color: rgb(236, 236, 236);
            transition: 0.35s ease;
        }

        div:hover {
            color: blue;
            background-color: rgb(197, 197, 197);
        }

        div > p {
            display: none;
        }

        div:hover > p {
            display: block;
            color: red;
        }

    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <p>Passe o mouse sobre o texto abaixo para ver o efeito de hover:</p>
    <div>
        AQUI
        <p>Texto escondido</p>
    </div>

</body>
</html>
